<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';"><title>S内部ブラウザ — CSV nyaan Viewer</title><link rel="stylesheet" href="s-browser.css"></head><body><main class="browser-chrome">
<div class="navigation"><strong id="service">S内部ブラウザ</strong><button id="back" title="戻る" aria-label="戻る">←</button><button id="forward" title="進む" aria-label="進む">→</button><button id="reload" aria-label="再読み込み">↻</button><form id="address-form"><input id="address" aria-label="内部ブラウザのURL" spellcheck="false"><button type="submit">移動</button></form><button id="external">外部ブラウザで開く</button></div>
<div class="login-row"><span id="account-state">サービスの画面でログインしてください。</span><input id="account-label" aria-label="Sアカウントの表示名" placeholder="表示名（任意）" maxlength="60"><button id="confirm">このログインを使用</button><button id="profile">画像を更新</button><button id="logout">ログアウト</button></div>
<div class="share-row" id="share-row" hidden><span id="file-name"></span><button id="save">共有ファイルを保存</button><button id="copy">本文をコピー</button><button id="native" hidden>アプリで開く</button></div>
<p id="guidance">ログインを確認できたら「このログインを使用」を押してください。認証が制限された場合は既存の「接続」を利用できます。</p><p id="notice" role="status"></p>
</main><script src="s-browser-chrome.js"></script></body></html>
