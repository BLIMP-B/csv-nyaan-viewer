name: Windows build, test and release
on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Windowsの署名方式（現在は検証用自己署名）'
        type: choice
        options: [self-signed-test, certificate, unsigned]
        default: self-signed-test
      require_signature:
        description: '有効なWindowsコード署名を必須にする'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    env:
      CSV_SIGNING_MODE: ${{ inputs.signing_mode || 'self-signed-test' }}
      WIN_CSC_LINK: ${{ inputs.signing_mode == 'certificate' && secrets.WINDOWS_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ inputs.signing_mode == 'certificate' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      CSV_REQUIRE_CODE_SIGNATURE: ${{ inputs.require_signature && 'true' || 'false' }}
    permissions:
      contents: read
      statuses: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Report build started
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending',
              context: 'CSV nyaan Viewer / Windows', description: 'Windows build and tests are running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - name: Prepare Windows code-signing certificate
        timeout-minutes: 2
        run: |
          if ($env:CSV_SIGNING_MODE -eq 'self-signed-test') {
            ./scripts/new-test-certificate.ps1
          } elseif ($env:CSV_SIGNING_MODE -eq 'certificate') {
            if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw 'WINDOWS_CSC_LINK is not configured' }
            'CSV_REQUIRE_CODE_SIGNATURE=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - run: npm run dist:win -- --publish never
      - name: Verify packaged Windows icon
        run: node scripts/verify-windows-icon.cjs
      - name: Verify Windows code signature
        run: ./scripts/verify-windows-signature.ps1
      - name: Package source and checksums
        id: package
        run: node scripts/package-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: CSV-nyaan-Viewer-release
          if-no-files-found: error
          retention-days: 30
          path: |
            release/CSV-nyaan-Viewer-*.zip
            release/SHA256SUMS.txt
            release/SIGNATURE.json
            release/test-signing.cer
      - name: Remove temporary test certificate and private key
        if: always()
        run: |
          if ($env:CSV_TEST_CERT_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            $my = "Cert:\CurrentUser\My\$env:CSV_TEST_CERT_THUMBPRINT"
            $scope = if ($env:CSV_TEST_ROOT_SCOPE -eq 'LocalMachine') { 'LocalMachine' } else { 'CurrentUser' }
            $root = "Cert:\$scope\Root\$env:CSV_TEST_CERT_THUMBPRINT"
            if (Test-Path $my) { Remove-Item $my -DeleteKey -Force }
            if (Test-Path $root) { Remove-Item $root -Force }
          }
      - name: Report build result
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: process.env.BUILD_RESULT === 'success' ? 'success' : 'failure',
              context: 'CSV nyaan Viewer / Windows', description: `Windows build: ${process.env.BUILD_RESULT}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Report release started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending',
              context: 'CSV nyaan Viewer / Release', description: 'Uploading downloadable release assets',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/download-artifact@v4
        with:
          name: CSV-nyaan-Viewer-release
          path: release
      - name: Publish Windows ZIP and source on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          assets=(release/*.zip release/SHA256SUMS.txt release/SIGNATURE.json)
          if [ -f release/test-signing.cer ]; then assets+=(release/test-signing.cer); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "CSV nyaan Viewer ${RELEASE_VERSION}" \
              --notes-file docs/release-notes.md
          fi
      - name: Report release result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_RESULT: ${{ job.status }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: process.env.RELEASE_RESULT === 'success' ? 'success' : 'failure',
              context: 'CSV nyaan Viewer / Release', description: `Release upload: ${process.env.RELEASE_RESULT}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/releases/tag/v${process.env.RELEASE_VERSION}`
            });
